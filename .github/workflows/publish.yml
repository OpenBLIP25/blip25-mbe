name: Publish

# Publishes the three crates to crates.io when a version tag is pushed.
#
# They publish bottom-up, because each depends on the one before it:
#
#     blip25-codebooks  ->  blip25-codec  ->  blip25-mbe
#
# All three carry the workspace version and move in lockstep. `cargo publish`
# resolves a path dependency's `version` against the registry, so each crate
# must be live and index-visible before the next one is uploaded.
#
# Release flow:
#   1. Bump `version` in the workspace `Cargo.toml` (all three inherit it) and
#      the `blip25-*` entries under [workspace.dependencies], update CHANGELOG,
#      commit to main.
#   2. Tag the release commit: `git tag -a vX.Y.Z -m "…" && git push origin vX.Y.Z`.
#   3. This workflow verifies, then publishes all three in order.
#
# The published version is whatever `Cargo.toml` says at the tagged commit — the
# tag name is for the git side. A mismatch (tag vX.Y.Z but Cargo.toml ≠ X.Y.Z)
# fails the guard below before anything is uploaded.
#
# Requires repo secret CARGO_REGISTRY_TOKEN (Settings → Secrets → Actions),
# a crates.io API token scoped to publish-update for an owner of all three
# crates. NOTE: on the very first publish of a new crate name the token also
# needs publish-new.
#
# Publishing is NOT reversible. A version can be yanked but never deleted.

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match ci.yml: the corpus-dependent tests fail rather than silently
  # skipping, so the release run has to acknowledge their absence too. Without
  # these, `cargo test --workspace` below fails and the publish never fires.
  BLIP25_ALLOW_MISSING_CORPUS: 1

jobs:
  publish:
    name: cargo publish (3 crates, bottom-up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          meta=$(cargo metadata --format-version 1 --no-deps)
          fail=0
          for c in blip25-codebooks blip25-codec blip25-mbe; do
            ver=$(echo "$meta" | python3 -c \
              "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$c'))")
            echo "  $c = $ver (tag $tag)"
            if [ "$tag" != "$ver" ]; then
              echo "::error::tag v$tag does not match $c version $ver"
              fail=1
            fi
          done
          exit $fail

      - name: Build + test
        run: cargo test --workspace --release

      - name: Publishability pre-flight
        run: python3 .github/scripts/check_publishable.py

      # Only blip25-codebooks can be verify-built here: the other two depend on
      # workspace siblings at the version being released, which is not on
      # crates.io until the steps below run.
      - name: Verify blip25-codebooks packages cleanly
        run: cargo package -p blip25-codebooks

      - name: Publish blip25-codebooks
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p blip25-codebooks

      - name: Publish blip25-codec
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --no-verify: the just-published blip25-codebooks may not be index-visible
        # yet, so a verify build would fail to resolve it. The package contents
        # were already verified in the step above and by CI's `package` job.
        run: cargo publish -p blip25-codec --no-verify

      - name: Publish blip25-mbe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p blip25-mbe --no-verify
